<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi página</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            text-align: center;
        }

        header {
            background: #222;
            color: white;
            padding: 40px 20px;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .tarjeta {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <header>
        <h1>¡Hola mundo!</h1>
        <p>Mi primera página web</p>
    </header>

    <main>
        <div class="tarjeta">
            <h2>Bienvenido</h2>

            <p>
                Esta página está alojada gratuitamente
                con GitHub Pages.
            </p>

            <button onclick="saludar()">
                Haz clic
            </button>
        </div>
    </main>

    <script>
        function saludar() {
            alert("¡Hola! 👋");
        }
    </script>

</body>
</html>
