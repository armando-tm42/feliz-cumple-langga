<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HBD langga! ❤️</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <main class="welcome-screen" id="welcome-screen">

        <!-- Background decoration -->
        <div class="floating-hearts" aria-hidden="true">
            <span>♡</span>
            <span>♡</span>
            <span>♥</span>
            <span>♡</span>
            <span>♥</span>
            <span>♡</span>
            <span>♥</span>
        </div>

        <!-- Main content -->
        <section class="welcome-content">

            <div class="special-word word-abashito">
                abachito
            </div>

            <div class="special-word word-beshito">
                beshito
            </div>

            <div class="photo-gallery">

                <div class="memory-photo photo-left">
                    <img
                        src="assets/images/pic-landing-page-1.jpeg"
                        alt="A beautiful memory"
                    >
                </div>

                <div class="memory-photo photo-right">
                    <img
                        src="assets/images/pic-landing-page-2.jpeg"
                        alt="Another beautiful memory"
                    >
                </div>

            </div>

            <p class="welcome-small-text">
                I love you more and there is no discussion about it 😤
            </p>

            <h1>
                Happy Birthday Love
                <span>❤️</span>
            </h1>

            <p class="welcome-description">
                Another birthday together 😊 
            </p>

            <button class="start-button" id="start-button">
                <span>Begin Our Story</span>
                <span class="button-heart">♡</span>
            </button>

        </section>

    </main>

    <script src="js/main.js"></script>
    <script src="js/effects.js"></script>

</body>
</html>
